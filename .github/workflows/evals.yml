# Evals a pedido (§11): Actions → Evals → Run workflow. Usan la API real, así que necesitan los secretos
# ANTHROPIC_API_KEY, GROQ_API_KEY, CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_API_TOKEN en el repo.
# Los scripts los escribe la pista A (scripts/eval-*.ts); si todavía no existen, el paso lo avisa y no falla.
name: Evals
on:
  workflow_dispatch:
    inputs:
      eval:
        description: Qué eval correr
        type: choice
        options: [vision, voz, recetas, variedad]
        default: vision

jobs:
  eval:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correr eval-${{ inputs.eval }}
        run: |
          SCRIPT="scripts/eval-${{ inputs.eval }}.ts"
          if [ ! -f "$SCRIPT" ]; then echo "::warning::$SCRIPT todavía no existe (pista A)"; exit 0; fi
          npx tsx "$SCRIPT" | tee "eval-${{ inputs.eval }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ inputs.eval }}
          path: eval-*.md
          if-no-files-found: ignore
